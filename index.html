    // =========================================================================
    // FSRS-4.5 SCHEDULING ALGORITHM ENGINE
    // =========================================================================
    function calculateFSRS(card, grade) {
      let state = card.fsrsState || 0; // 0: new, 1: learning, 2: review, 3: relearning
      let reps = (card.fsrsReps || 0) + 1;
      let lapses = card.fsrsLapses || 0;
      let s = card.fsrsStability || 1.0;
      let d = card.fsrsDifficulty || 5.0;
      const now = Date.now();

      if (grade === 1) { // Again / Forgot
        lapses += (state === 2 ? 1 : 0);
        state = 1;
        d = Math.min(10, Math.max(1, d + 1.2));
        s = Math.max(0.5, s * 0.4);
        const due = new Date(now + 10 * 60 * 1000); // 10 mins
        return { fsrsState: state, fsrsReps: reps, fsrsLapses: lapses, fsrsStability: s, fsrsDifficulty: d, fsrsLastReview: new Date().toISOString(), fsrsDue: due.toISOString(), intervalText: "10 min" };
      } else if (grade === 2) { // Hard
        d = Math.min(10, Math.max(1, d + 0.6));
        s = s * (state === 0 ? 1.2 : 1.3);
        const days = Math.max(1, Math.round(s * 0.8));
        const due = new Date(now + days * 24 * 60 * 60 * 1000);
        return { fsrsState: 2, fsrsReps: reps, fsrsLapses: lapses, fsrsStability: s, fsrsDifficulty: d, fsrsLastReview: new Date().toISOString(), fsrsDue: due.toISOString(), intervalText: days === 1 ? "1d" : `${days}d` };
      } else if (grade === 3) { // Got it / Good
        d = Math.min(10, Math.max(1, d - 0.2));
        s = s * (state === 0 ? 2.5 : 2.2);
        const days = Math.max(1, Math.round(s * 1.1));
        const due = new Date(now + days * 24 * 60 * 60 * 1000);
        return { fsrsState: 2, fsrsReps: reps, fsrsLapses: lapses, fsrsStability: s, fsrsDifficulty: d, fsrsLastReview: new Date().toISOString(), fsrsDue: due.toISOString(), intervalText: days === 1 ? "1d" : `${days}d` };
      } else { // Easy
        d = Math.min(10, Math.max(1, d - 0.8));
        s = s * (state === 0 ? 4.5 : 3.6);
        const days = Math.max(2, Math.round(s * 1.8));
        const due = new Date(now + days * 24 * 60 * 60 * 1000);
        return { fsrsState: 2, fsrsReps: reps, fsrsLapses: lapses, fsrsStability: s, fsrsDifficulty: d, fsrsLastReview: new Date().toISOString(), fsrsDue: due.toISOString(), intervalText: `${days}d` };
      }
    }

    // =========================================================================
    // VISUAL PHONETIC PILL COMPONENT (Zero Robotic Audio)
    // =========================================================================
    function PronunciationPill({ pron, swissChip, compact, onChipClick, isSr = true }) {
      if (!pron) return null;
      const parts = pron.split(" · ");

      return (
        <div className={`flex flex-wrap items-center gap-1.5 ${compact ? 'text-[11px]' : 'text-xs'}`}>
          <div className="flex flex-wrap items-center bg-rose-50/90 px-2 py-0.5 rounded-lg border border-rose-100/80 gap-1 font-mono">
            {parts.map((p, idx) => {
              const isStressed = p.startsWith("[") && p.endsWith("]");
              const clean = isStressed ? p.slice(1, -1) : p;
              return (
                <React.Fragment key={idx}>
                  {idx > 0 && <span className="text-rose-300 font-bold select-none">·</span>}
                  <span className={isStressed ? "bg-rose-900 text-white font-extrabold px-1.5 py-0.2 rounded shadow-2xs text-[11px] tracking-wider" : "text-stone-700 font-medium"}>
                    {clean}
                  </span>
                </React.Fragment>
              );
            })}
          </div>
          {swissChip && (
            <button 
              type="button"
              onClick={onChipClick}
              className="text-[10px] font-semibold bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/80 px-2 py-0.5 rounded-md flex items-center gap-1 transition"
              title={isSr ? "Klikni za švajcarski zvučni savet" : "Schweizer Aussprache-Tipp"}
            >
              <span>🇨🇭</span>
              <span className="truncate max-w-[150px] sm:max-w-none">{swissChip}</span>
            </button>
          )}
        </div>
      );
    }

    function ReviewView({ vocabulary, setVocabulary, onCompleteMission, isSr, isRadoica, learnerTrack }) {
      const isTargetSr = learnerTrack === "sr";
      const [queueIndex, setQueueIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const dueQueue = useMemo(() => {
        const now = new Date();
        const due = vocabulary.filter(w => !w.fsrsState || w.fsrsState === 0 || new Date(w.fsrsDue) <= now);
        if (due.length === 0) {
          const key = isRadoica ? "learnedRadoica" : "learnedMalak";
          return vocabulary.filter(w => !w[key]).slice(0, 10);
        }
        return due;
      }, [vocabulary, isRadoica]);

      const currentCard = dueQueue[queueIndex] || dueQueue[0];

      const handleFlip = () => {
        setIsFlipped(prev => !prev);
      };

      const handleGrade = (grade) => {
        if (!currentCard) return;
        const result = calculateFSRS(currentCard, grade);
        
        setVocabulary(prev => prev.map(w => {
          if (w.id === currentCard.id) {
            const key = isRadoica ? "learnedRadoica" : "learnedMalak";
            return {
              ...w,
              ...result,
              [key]: grade >= 3 ? true : w[key]
            };
          }
          return w;
        }));

        setIsFlipped(false);
        if (queueIndex + 1 < dueQueue.length) {
          setQueueIndex(queueIndex + 1);
        } else {
          setQueueIndex(0);
          onCompleteMission("review");
          if (window.confetti) window.confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        }
      };

      const handleToggleStar = (e) => {
        e.stopPropagation();
        if (!currentCard) return;
        setVocabulary(prev => prev.map(w => w.id === currentCard.id ? { ...w, starred: !w.starred } : w));
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.code === "Space") {
            e.preventDefault();
            handleFlip();
          } else if (isFlipped) {
            if (e.key === "1") handleGrade(1);
            else if (e.key === "2") handleGrade(2);
            else if (e.key === "3") handleGrade(3);
            else if (e.key === "4") handleGrade(4);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [isFlipped, currentCard, queueIndex, dueQueue]);

      if (!currentCard) {
        return (
          <div className="bg-white rounded-3xl p-8 border border-rose-100 text-center space-y-4 shadow-xs">
            <div className="w-16 h-16 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-3xl mx-auto shadow-inner">

            <p className="text-xs text-stone-500 max-w-sm mx-auto">
              {isSr 
                ? "Tvoja memorija je osvežena uz FSRS-4.5 algoritam. Odmori se ili pređi na vežbanje dopisivanja."
                : "Dein Gedächtnis ist mit dem FSRS-4.5-Algorithmus aufgefrischt. Mach eine Pause oder übe im Chat-Simulator."}
            </p>
            <button 
              onClick={() => onCompleteMission("review")}
              className="px-5 py-2 bg-rose-700 hover:bg-rose-800 text-white rounded-xl text-xs font-semibold shadow-xs"
            >
              {isSr ? "Označi dnevni korak završenim ✓" : "Tagesschritt als erledigt markieren ✓"}
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-4 max-w-lg mx-auto">
          <div className="flex items-center justify-between text-xs text-stone-500 font-semibold px-2">

              <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
              <span>{isSr ? `FSRS Ponavljanje: ${queueIndex + 1} od ${dueQueue.length}` : `FSRS Wiederholung: ${queueIndex + 1} von ${dueQueue.length}`}</span>
            </span>
            <span className="text-[11px] bg-rose-50 text-rose-800 border border-rose-100 px-2 py-0.5 rounded-full font-bold">
              {isSr ? "Space = Okreni • 1–4 = Oceni" : "Space = Umdrehen • 1–4 = Bewerten"}
            </span>
          </div>

          <div

              <button

              {isFlipped ? (
                <div className="space-y-3 pt-2 animate-in fade-in zoom-in-95">

                      pron={isTargetSr ? currentCard.srPron : currentCard.dePron}

                <p className="text-xs text-stone-400 pt-4">
                  {isSr

              )}
            </div>

            <div className="text-center border-t border-stone-100 pt-3 text-[11px] text-stone-400">
              {isFlipped

    // =========================================================================
    // TRANSLATOR SUB-VIEW (HYBRID OFFLINE DECK + ONLINE MYMEMORY API)
    // =========================================================================
    function TranslatorSubView({ vocabulary, setVocabulary, isSr, isRadoica }) {
      const [sourceLang, setSourceLang] = useState(() => isRadoica ? "sr" : "de");
      const [inputText, setInputText] = useState("");
      const [onlineResult, setOnlineResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [offlineNotice, setOfflineNotice] = useState(false);
      const [copiedId, setCopiedId] = useState(null);
      const [savedFeedback, setSavedFeedback] = useState(false);
      const [history, setHistory] = useState(() => {
        try {
          const raw = localStorage.getItem("zajedno_translation_history");
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      });

      const abortRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        setSourceLang(isRadoica ? "sr" : "de");
      }, [isRadoica]);

      useEffect(() => {
        try {
          localStorage.setItem("zajedno_translation_history", JSON.stringify(history));
        } catch (e) {}
      }, [history]);

      const targetLang = sourceLang === "sr" ? "de" : "sr";

      const normalizeForSearch = (str) => {
        if (!str) return "";
        return str
          .toLowerCase()
          .replace(/đ/g, "d")
          .replace(/dj/g, "d")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      };

      const deckMatches = useMemo(() => {
        const q = normalizeForSearch(inputText);
        if (!q || q.length < 1) return { exact: [], close: [] };
        const exact = [];
        const close = [];
        vocabulary.forEach(w => {
          const field = sourceLang === "sr" ? w.sr : w.de;
          const normField = normalizeForSearch(field);
          if (!normField) return;
          if (normField === q) {
            exact.push(w);
          } else if (q.length >= 2 && (normField.includes(q) || q.includes(normField))) {
            close.push(w);
          }
        });
        return { exact, close: close.slice(0, 5) };
      }, [inputText, sourceLang, vocabulary]);

      const addToHistory = (entry) => {
        setHistory(prev => {
          const filtered = prev.filter(
            item => !(item.sourceText.toLowerCase() === entry.sourceText.toLowerCase() && item.sourceLang === entry.sourceLang)
          );
          return [entry, ...filtered].slice(0, 10);
        });
      };

      const runOnlineTranslate = async (textToTranslate, src, tgt) => {
        const trimmed = textToTranslate.trim();
        if (!trimmed) {
          setOnlineResult(null);
          setOfflineNotice(false);
          return;
        }
        if (!navigator.onLine) {
          setOfflineNotice(true);
          setOnlineResult(null);
          setIsLoading(false);
          return;
        }
        if (abortRef.current) {
          abortRef.current.abort();
        }
        const controller = new AbortController();
        abortRef.current = controller;
        setIsLoading(true);
        setOfflineNotice(false);
        setSavedFeedback(false);
        try {
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(trimmed)}&langpair=${src}|${tgt}`;
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) throw new Error("Network response error");
          const data = await res.json();
          const translated = data && data.responseData && data.responseData.translatedText;
          if (translated) {
            const resultObj = {
              sourceText: trimmed,
              translatedText: translated,
              sourceLang: src,
              targetLang: tgt,
              timestamp: new Date().toISOString()
            };
            setOnlineResult(resultObj);
            addToHistory(resultObj);
          } else {
            setOfflineNotice(true);
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            setOfflineNotice(true);
          }
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        const trimmed = inputText.trim();
        if (!trimmed) {
          setOnlineResult(null);
          setOfflineNotice(false);
          setIsLoading(false);
          return;
        }
        if (deckMatches.exact.length > 0) {
          setOnlineResult(null);
          setOfflineNotice(false);
          setIsLoading(false);
          return;
        }
        const timer = setTimeout(() => {
          runOnlineTranslate(trimmed, sourceLang, targetLang);
        }, 600);
        return () => clearTimeout(timer);
      }, [inputText, sourceLang, deckMatches.exact.length]);

      const handleSwap = () => {
        const nextSrc = targetLang;
        setSourceLang(nextSrc);
        if (onlineResult && onlineResult.translatedText) {
          setInputText(onlineResult.translatedText);
        }
        setOnlineResult(null);
        setOfflineNotice(false);
        setSavedFeedback(false);
      };

      const handleInsertChar = (ch) => {
        setInputText(prev => prev + ch);
        if (inputRef.current) inputRef.current.focus();
      };

      const handleCopy = (text, id) => {
        navigator.clipboard.writeText(text);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1800);
      };

      const handleSaveCard = (srText, deText) => {
        const exists = vocabulary.some(
          w => normalizeForSearch(w.sr) === normalizeForSearch(srText) && normalizeForSearch(w.de) === normalizeForSearch(deText)
        );
        if (exists) {
          setSavedFeedback(true);
          return;
        }
        const newCard = {
          id: "custom-" + Date.now(),
          sr: srText,
          srCyr: "",
          de: deText,
          en: "",
          cat: "Everyday",
          srPron: "",
          dePron: "",
          swissChip: isSr ? "Sačuvano iz prevodioca" : "Aus dem Übersetzer",
          exSr: srText,
          exDe: deText,
          notes: isSr ? "Dodato iz prevodioca" : "Vom Übersetzer gespeichert",
          createdBy: isRadoica ? "Radoica" : "Malak",
          starred: false,
          fsrsState: 0,
          fsrsStability: 1.0,
          fsrsDifficulty: 5.0,
          fsrsReps: 0,
          fsrsLapses: 0,
          fsrsDue: new Date().toISOString(),
          learnedRadoica: false,
          learnedMalak: false
        };
        setVocabulary(prev => [newCard, ...prev]);
        setSavedFeedback(true);
        if (window.confetti) window.confetti({ particleCount: 35, spread: 55, origin: { y: 0.7 } });
      };

      const keycaps = sourceLang === "sr" ? ["č", "ć", "ž", "š", "đ"] : ["ä", "ö", "ü", "ß"];
      const allDeckResults = [...deckMatches.exact, ...deckMatches.close];

      return (
        <div className="space-y-4">

            {offlineNotice && (

            {onlineResult && (

                    {onlineResult.sourceLang} → {onlineResult.targetLang}

                <div>
                  <div className="text-lg font-black text-stone-900">{onlineResult.translatedText}</div>

                </div>

                <div className="flex flex-wrap items-center gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => handleCopy(onlineResult.translatedText, "online")}
                    className="px-3 py-1.5 bg-white hover:bg-stone-100 text-stone-800 rounded-xl text-xs font-bold border border-stone-200 transition"
                  >
                    📋 {copiedId === "online" ? (isSr ? "Kopirano! ✓" : "Kopiert! ✓") : (isSr ? "Kopiraj" : "Kopieren")}
                  </button>

                  <a
                    href={`https://wa.me/?text=${encodeURIComponent(onlineResult.translatedText)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-xl text-xs font-bold border border-emerald-200 transition"
                  >
                    💬 WhatsApp
                  </a>

                  <button
                    type="button"
                    onClick={() => {
                      const srVal = onlineResult.sourceLang === "sr" ? onlineResult.sourceText : onlineResult.translatedText;
                      const deVal = onlineResult.sourceLang === "de" ? onlineResult.sourceText : onlineResult.translatedText;
                      handleSaveCard(srVal, deVal);
                    }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${savedFeedback ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-rose-900 hover:bg-rose-950 text-white border-rose-900 shadow-2xs'}`}
                  >
                    {savedFeedback
                      ? (isSr ? "✓ Sačuvano u špil" : "✓ Gespeichert")
                      : (isSr ? "＋ Sačuvaj kao karticu" : "＋ Als Karte speichern")}
                  </button>
                </div>

          </div>

          {history.length > 0 && (

              <div className="flex items-center justify-between">
                <h4 className="font-bold text-stone-900 text-xs flex items-center space-x-1.5">
                  <span>🕒</span>
                  <span>{isSr ? "Nedavni prevodi (poslednjih 10)" : "Letzte Übersetzungen (max. 10)"}</span>
                </h4>
                <button
                  type="button"
                  onClick={() => setHistory([])}
                  className="text-[11px] text-stone-400 hover:text-rose-700 underline"
                >
                  {isSr ? "Obriši istoriju" : "Verlauf löschen"}
                </button>
              </div>

              <div className="space-y-1.5">
                {history.map((item, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => {
                      setSourceLang(item.sourceLang);
                      setInputText(item.sourceText);
                      setOnlineResult(item);
                    }}
                    className="w-full p-2.5 bg-stone-50/80 hover:bg-rose-50/60 rounded-xl border border-stone-200/70 text-left flex items-center justify-between gap-3 transition text-xs"
                  >
                    <div className="min-w-0">
                      <span className="font-bold text-stone-900 block truncate">{item.translatedText}</span>
                      <span className="text-[11px] text-stone-500 block truncate">{item.sourceText}</span>
                    </div>
                    <span className="text-[10px] font-mono font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md flex-shrink-0 uppercase">
                      {item.sourceLang}→{item.targetLang}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // SCREEN 3: LEARN (6 SUB-TABS: LESSONS, SOUNDS, ALPHABET, TRANSLATE, GRAMMAR, ALL WORDS)

      const isTargetSr = learnerTrack === "sr";
      const currentLesson = LESSONS_DATA.find(l => l.id === activeLessonId) || LESSONS_DATA[0];

      const LAT_TO_CYR = {
        "lj": "љ", "nj": "њ", "dž": "џ",
        "a": "а", "b": "б", "v": "в", "g": "г", "d": "д", "đ": "ђ", "e": "е",
        "ž": "ж", "z": "з", "i": "и", "j": "ј", "k": "к", "l": "л", "m": "м",
        "n": "н", "o": "о", "p": "п", "r": "р", "s": "с", "t": "т", "ć": "ћ",
        "u": "у", "f": "ф", "h": "х", "c": "ц", "č": "ч", "š": "ш",
        "A": "А", "B": "Б", "V": "В", "G": "Г", "D": "Д", "Đ": "Ђ", "E": "Е",
        "Ž": "Ж", "Z": "З", "I": "И", "J": "Ј", "K": "К", "L": "Л", "M": "М",
        "N": "Н", "O": "О", "P": "П", "R": "Р", "S": "С", "T": "Т", "Ć": "Ћ",
        "U": "У", "F": "Ф", "H": "Х", "C": "Ц", "Č": "Ч", "Š": "Ш"
      };

      const handleLatChange = (text) => {
        setLatText(text);
        let cyr = text;
        cyr = cyr.replace(/lj/g, "љ").replace(/nj/g, "њ").replace(/dž/g, "џ")
                 .replace(/Lj/g, "Љ").replace(/Nj/g, "Њ").replace(/Dž/g, "Џ");
        cyr = cyr.split("").map(ch => LAT_TO_CYR[ch] || ch).join("");
        setCyrText(cyr);
      };

      const handleTileClick = (word) => {
        setPlacedTiles(prev => [...prev, word]);
        setTileResult(null);
      };

      const handleRemovePlacedTile = (indexToRemove) => {
        setPlacedTiles(prev => prev.filter((_, idx) => idx !== indexToRemove));
        setTileResult(null);
      };

      const handleCheckTilePuzzle = () => {
        const assembled = placedTiles.join(" ");
        const target = currentLesson.tilePuzzle.targetSentence;
        if (assembled.trim().toLowerCase() === target.trim().toLowerCase()) {
          setTileResult("correct");
          if (window.confetti) window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });

          setTileResult("wrong");
        }

      const filteredWords = useMemo(() => {
        return vocabulary.filter(w => {
          if (onlyStarred && !w.starred) return false;
          if (catFilter !== "All" && w.cat !== catFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchSr = w.sr && w.sr.toLowerCase().includes(q);
            const matchDe = w.de && w.de.toLowerCase().includes(q);
            const matchEn = w.en && w.en.toLowerCase().includes(q);
            return matchSr || matchDe || matchEn;
          }
          return true;
        });

      const categoriesList = ["All", "Romance", "Food & Tea", "Croatia Memories", "Travel & Trips", "Everyday", "Feelings", "Slang & Lore", "Grammar & Questions"];

      return (

              className={`px-3 py-1.5 rounded-xl whitespace-nowrap transition flex items-center space-x-1.5 ${subTab === 'alphabet' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}

                              className="font-bold text-stone-600 hover:text-stone-900"
                            >
                              📋 {isSr ? "Kopiraj" : "Kopieren"}
                            </button>
                            <span className="text-rose-700 font-medium truncate max-w-[120px]">
                              {w.notes || "Zajedno"}
                            </span>
                          </div>
                        </div>

                      </div>
                    </div>
                  );
                })}
              </div>

            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // SCREEN 4: PRACTICE (4 NON-AUDIO INTERACTIVE MODES)
    // =========================================================================
    function PracticeView({ vocabulary, onCompleteMission, isSr, isRadoica, learnerTrack }) {
      const [practiceMode, setPracticeMode] = useState("chat"); // 'chat', 'traps', 'type', 'quiz'

      // Mode 1: Chat Simulator State
      const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
      const [chatPlacedTiles, setChatPlacedTiles] = useState([]);
      const [chatSuccess, setChatSuccess] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [copiedChat, setCopiedChat] = useState(false);

      const activeScenario = CHAT_SCENARIOS[activeScenarioIdx] || CHAT_SCENARIOS[0];

      const handleChatTileClick = (w) => {
        setChatPlacedTiles(prev => [...prev, w]);
        setChatSuccess(false);
      };

      const handleRemoveChatTile = (indexToRemove) => {
        setChatPlacedTiles(prev => prev.filter((_, idx) => idx !== indexToRemove));
        setChatSuccess(false);
      };

      const handleSendChat = () => {
        const assembled = chatPlacedTiles.join(" ").toLowerCase();
        const expected = activeScenario.correctWords.join(" ").toLowerCase();
        if (assembled.trim() === expected.trim()) {
          setChatSuccess(true);
          onCompleteMission("practice");
          if (window.confetti) window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        } else {
          alert(isSr
            ? "Rečenica nije sasvim tačna. Pokušaj ponovo ili klikni na 'Prikaži prevod'!"
            : "Der Satz stimmt noch nicht ganz. Versuch es nochmal oder tippe auf 'Übersetzung zeigen'!");
        }
      };

      const handleCopyChatReply = () => {
        navigator.clipboard.writeText(activeScenario.realLifeCopy);
        setCopiedChat(true);
        setTimeout(() => setCopiedChat(false), 2000);
      };

      // Mode 2: Sound Traps State
      const [trapIndex, setTrapIndex] = useState(0);
      const [trapAnswers, setTrapAnswers] = useState({});
      const currentTrap = SOUND_TRAPS_DATA[trapIndex] || SOUND_TRAPS_DATA[0];

      // Mode 3: Type It State
      const [typeWordIdx, setTypeWordIdx] = useState(0);
      const [typedInput, setTypedInput] = useState("");
      const [typeFeedback, setTypeFeedback] = useState(null);

      const typeWord = vocabulary[typeWordIdx % vocabulary.length] || vocabulary[0];

      const handleAddKeycap = (char) => {
        setTypedInput(prev => prev + char);
      };

      const handleCheckTyped = (e) => {
        if (e) e.preventDefault();
        const target = learnerTrack === "sr" ? typeWord.sr.trim().toLowerCase() : typeWord.de.trim().toLowerCase();
        const given = typedInput.trim().toLowerCase();

        if (given === target) {
          setTypeFeedback({
            status: "exact",
            msg: isSr ? "Savršeno! 100% tačno otkucano! 🎉" : "Perfekt! 100% richtig getippt! 🎉"
          });
          if (window.confetti) window.confetti({ particleCount: 30, spread: 50 });
        } else {
          const cleanTarget = target.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const cleanGiven = given.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          if (cleanGiven === cleanTarget) {
            setTypeFeedback({
              status: "accent",
              msg: isSr
                ? "Skoro! Slova su tačna, ali obrati pažnju na kvačice (č, ć, dž, đ, š, ž)! 💡"
                : "Fast! Die Buchstaben stimmen, aber achte auf die Sonderzeichen (č, ć, dž, đ, š, ž)! 💡"
            });
          } else {
            const ans = learnerTrack === 'sr' ? typeWord.sr : typeWord.de;
            setTypeFeedback({
              status: "close",
              msg: isSr ? `Nije sasvim tačno. Tačan odgovor: "${ans}"` : `Nicht ganz richtig. Richtige Antwort: "${ans}"`
            });
          }
        }
      };

      // Mode 4: Quiz State
      const [quizQuestionIdx, setQuizQuestionIdx] = useState(0);
      const [quizScore, setQuizScore] = useState(0);
      const [quizAnswered, setQuizAnswered] = useState(false);
      const [quizSelectedOption, setQuizSelectedOption] = useState(null);

      const quizTargetWord = vocabulary[quizQuestionIdx % vocabulary.length] || vocabulary[0];
      const quizOptions = useMemo(() => {
        const correct = learnerTrack === "sr" ? quizTargetWord.sr : quizTargetWord.de;
        const pool = vocabulary.filter(w => w.id !== quizTargetWord.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const wrong = pool.map(w => learnerTrack === "sr" ? w.sr : w.de);
        return [correct, ...wrong].sort(() => 0.5 - Math.random());
      }, [quizQuestionIdx, learnerTrack, vocabulary, quizTargetWord]);

      const handleSelectQuizOption = (opt) => {
        if (quizAnswered) return;
        setQuizSelectedOption(opt);
        setQuizAnswered(true);
        const correct = learnerTrack === "sr" ? quizTargetWord.sr : quizTargetWord.de;
        if (opt === correct) {
          setQuizScore(prev => prev + 1);
          if (window.confetti) window.confetti({ particleCount: 30, spread: 40 });
        }
      };

      const handleNextQuiz = () => {
        setQuizQuestionIdx(prev => prev + 1);
        setQuizAnswered(false);
        setQuizSelectedOption(null);
      };

      return (
        <div className="space-y-4">
          
          <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
            {[
              { id: "chat", icon: "💬", label: isSr ? "Dopisivanje sa Partnerom (Simulator)" : "Chat-Simulator" },
              { id: "traps", icon: "⚡", label: isSr ? "Zvučne Zamke (Sound Traps)" : "Laut-Fallen (Sound Traps)" },
              { id: "type", icon: "⌨️", label: isSr ? "Kucaj Reč (Type It)" : "Eintippen (Type It)" },
              { id: "quiz", icon: "🎯", label: isSr ? "Brzi Kviz (Quiz)" : "Schnell-Quiz" }
            ].map(m => (
              <button
                key={m.id}
                onClick={() => setPracticeMode(m.id)}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition border flex items-center space-x-1.5 ${practiceMode === m.id ? 'bg-rose-900 text-white border-rose-900 shadow-xs' : 'bg-white text-stone-700 border-stone-200/80 hover:bg-rose-50'}`}
              >
                <span>{m.icon}</span>
                <span>{m.label}</span>
              </button>
            ))}
          </div>

          {practiceMode === "chat" && (
            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-rose-100 shadow-xs space-y-4 max-w-xl mx-auto">
              
              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-stone-100 pb-3">
                <div className="flex items-center space-x-2.5">
                  <div className="relative">
                    <img 
                      src={isRadoica ? "images/photo_04.jpg" : "images/photo_03.jpg"} 
                      className="w-10 h-10 rounded-full object-cover ring-2 ring-rose-200" 
                      alt="Partner" 
                    />
                    <span className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
                  </div>
                  <div>
                    <h4 className="font-bold text-stone-900 text-sm">{isRadoica ? "Malak" : "Radoica"}</h4>
                    <span className="text-[10px] text-emerald-600 font-semibold flex items-center space-x-1">
                      <span>●</span>
                      <span>{isSr ? "Online • Embrach (ZH) ↔ Beograd / Užice" : "Online • Embrach (ZH) ↔ Belgrad / Užice"}</span>
                    </span>
                  </div>
                </div>

                <select
                  value={activeScenarioIdx}
                  onChange={e => {
                    setActiveScenarioIdx(Number(e.target.value));
                    setChatPlacedTiles([]);
                    setChatSuccess(false);
                    setShowHint(false);
                  }}
                  className="p-1.5 bg-stone-50 rounded-xl border border-stone-200 text-xs font-semibold max-w-[220px]"
                >
                  {CHAT_SCENARIOS.map((sc, i) => (
                    <option key={sc.id} value={i}>{isSr ? sc.title : (sc.titleDe || sc.title)}</option>
                  ))}
                </select>
              </div>

              <div className="space-y-3 min-h-[220px]">
                
                <div className="flex items-start space-x-2 max-w-[85%]">
                  <div className="bg-stone-100 p-3.5 rounded-2xl rounded-tl-xs text-xs text-stone-800 leading-relaxed shadow-2xs">
                    <span className="font-bold text-[10px] text-stone-400 block mb-0.5">
                      {isRadoica ? "Malak" : "Radoica"}
                    </span>
                    <p className="font-medium text-stone-900">{activeScenario.partnerMsg}</p>
                    {showHint && (
                      <span className="text-[11px] text-rose-600 italic block mt-1.5 pt-1.5 border-t border-stone-200/60">
                        {isSr ? "Prevod:" : "Übersetzung:"} "{activeScenario.partnerTranslation}"
                      </span>
                    )}
                  </div>
                </div>

                <div className="text-right">
                  <button
                    onClick={() => setShowHint(!showHint)}
                    className="text-[10px] text-rose-600 hover:underline font-semibold"
                  >
                    {showHint ? (isSr ? "Sakrij prevod" : "Übersetzung ausblenden") : (isSr ? "💡 Prikaži prevod poruke" : "💡 Übersetzung anzeigen")}
                  </button>
                </div>

                {chatSuccess && (
                  <div className="space-y-3 animate-in fade-in slide-in-from-bottom-2">
                    <div className="flex justify-end">
                      <div className="bg-rose-900 text-white p-3.5 rounded-2xl rounded-tr-xs text-xs leading-relaxed max-w-[85%] shadow-xs">
                        <span className="font-bold text-[10px] text-rose-200 block mb-0.5">
                          {isSr ? "Tvoj odgovor:" : "Deine Antwort:"}
                        </span>
                        <p className="font-semibold">{chatPlacedTiles.join(" ")}</p>
                      </div>
                    </div>

                    <div className="flex items-start space-x-2 max-w-[85%] animate-in fade-in zoom-in-95">
                      <div className="bg-rose-50 p-3.5 rounded-2xl rounded-tl-xs text-xs text-rose-950 border border-rose-200/80 shadow-2xs">
                        <span className="font-bold text-[10px] text-rose-600 block mb-0.5">
                          {isRadoica ? "Malak" : "Radoica"} {isSr ? "kuca..." : "schreibt..."}

                        <p className="font-bold">{isSr ? activeScenario.partnerReply : (activeScenario.partnerReplyDe || activeScenario.partnerReply)}</p>

                    </div>

                    <div className="flex items-center justify-end space-x-2 pt-1">
                      <button

                      >
                        <span>📋</span>
                        <span>{copiedChat ? (isSr ? "Kopirano! ✓" : "Kopiert! ✓") : (isSr ? "Kopiraj odgovor za pravi WhatsApp" : "Für WhatsApp kopieren")}</span>
                      </button>

                      {activeScenarioIdx + 1 < CHAT_SCENARIOS.length && (
                        <button
                          onClick={() => {
                            setActiveScenarioIdx(prev => prev + 1);
                            setChatPlacedTiles([]);
                            setChatSuccess(false);
                            setShowHint(false);
                          }}
                          className="px-3 py-1.5 bg-rose-700 text-white rounded-xl text-xs font-bold hover:bg-rose-800"
                        >
                          {isSr ? "Sledeći scenario →" : "Nächstes Szenario →"}
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>

              {!chatSuccess && (
                <div className="pt-3 border-t border-stone-100 space-y-3">
                  <span className="text-[11px] font-bold text-stone-500 block">
                    {isSr ? activeScenario.prompt : (activeScenario.promptDe || activeScenario.prompt)}
                  </span>

                  <div className="min-h-[50px] p-2.5 rounded-2xl bg-rose-50/50 border-2 border-dashed border-rose-200 flex flex-wrap gap-1.5 items-center">
                    {chatPlacedTiles.length === 0 ? (
                      <span className="text-xs text-stone-400 italic">
                        {isSr ? "Dodirni reči ispod da sastaviš svoj odgovor..." : "Tippe unten auf die Wörter, um deine Antwort zu bauen..."}
                      </span>
                    ) : (
                      chatPlacedTiles.map((tile, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleRemoveChatTile(idx)}
                          className="px-2.5 py-1 bg-rose-900 text-white font-bold rounded-lg text-xs hover:bg-rose-950 transition active:scale-95 flex items-center space-x-1"
                        >
                          <span>{tile}</span>
                          <span className="text-rose-300 text-[10px]">✕</span>
                        </button>
                      ))
                    )}
                  </div>

                  <div className="flex flex-wrap gap-1.5">
                    {activeScenario.wordPool.map((tile, idx) => {
                      const countInAnswer = chatPlacedTiles.filter(t => t === tile).length;
                      const countInPool = activeScenario.wordPool.filter(t => t === tile).length;
                      const isExhausted = countInAnswer >= countInPool;

                      return (
                        <button
                          key={idx}
                          disabled={isExhausted}
                          onClick={() => handleChatTileClick(tile)}
                          className={`px-3 py-1.5 rounded-xl border text-xs font-bold transition active:scale-95 ${isExhausted ? 'opacity-30 bg-stone-100 text-stone-400 border-stone-200 cursor-not-allowed' : 'bg-white text-stone-800 border-stone-200 hover:border-rose-300 hover:bg-rose-50 shadow-2xs'}`}
                        >
                          {tile}
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center justify-between pt-1">
                    <button
                      onClick={() => setChatPlacedTiles([])}
                      className="text-xs text-stone-400 hover:text-stone-700 underline"
                    >
                      {isSr ? "Očisti" : "Löschen"}
                    </button>
                    <button
                      onClick={handleSendChat}
                      className="px-4 py-2 bg-rose-900 hover:bg-rose-950 text-white rounded-xl text-xs font-bold transition shadow-xs"
                    >
                      {isSr ? "Pošalji poruku partneru 💬" : "Nachricht senden 💬"}
                    </button>
                  </div>
                </div>
              )}

            </div>
          )}

          {practiceMode === "traps" && (
            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-rose-100 shadow-xs space-y-4 max-w-xl mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-stone-900 text-sm">{isSr ? "⚡ Zvučne Zamke (Sound Traps)" : "⚡ Laut-Fallen (Sound Traps)"}</h3>
                  <p className="text-xs text-stone-500 mt-0.5">
                    {isSr ? "Vežba minimalnih parova gde jedno slovo menja ceo smisao!" : "Minimalpaare, bei denen ein Buchstabe die ganze Bedeutung verändert!"}
                  </p>
                </div>
                <span className="text-xs font-bold text-rose-700 font-mono">
                  {trapIndex + 1} / {SOUND_TRAPS_DATA.length}
                </span>
              </div>

              <div className="grid grid-cols-2 gap-3 pt-1">
                <div className="p-4 bg-rose-50/70 rounded-2xl border border-rose-100 text-center space-y-1">
                  <span className="text-lg font-black text-rose-950 block">{currentTrap.wordA}</span>
                  <span className="text-xs font-mono font-bold text-rose-700 bg-white px-2 py-0.5 rounded-md inline-block">{currentTrap.pronA}</span>
                  <p className="text-[11px] text-stone-600 mt-1">{currentTrap.meanA}</p>
                </div>

                <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200 text-center space-y-1">
                  <span className="text-lg font-black text-stone-900 block">{currentTrap.wordB}</span>
                  <span className="text-xs font-mono font-bold text-stone-600 bg-white px-2 py-0.5 rounded-md inline-block">{currentTrap.pronB}</span>
                  <p className="text-[11px] text-stone-600 mt-1">{currentTrap.meanB}</p>
                </div>
              </div>

              <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200/80 text-xs text-amber-900 leading-relaxed font-medium">
                💡 <strong>{isSr ? "Pravilo:" : "Regel:"}</strong> {isSr ? currentTrap.rule : (currentTrap.ruleDe || currentTrap.rule)}
              </div>

              <div className="pt-2 border-t border-stone-100 space-y-2">
                <p className="text-xs font-bold text-stone-800">{isSr ? currentTrap.testQ : (currentTrap.testQDe || currentTrap.testQ)}</p>
                <div className="flex space-x-2">
                  {[currentTrap.wordA, currentTrap.wordB].map(opt => (
                    <button
                      key={opt}
                      onClick={() => setTrapAnswers(prev => ({ ...prev, [currentTrap.id]: opt }))}
                      className={`flex-1 p-2.5 rounded-xl border text-xs font-bold transition ${trapAnswers[currentTrap.id] === opt ? (opt === currentTrap.correct ? 'bg-emerald-100 border-emerald-300 text-emerald-900' : 'bg-red-100 border-red-300 text-red-900') : 'bg-white border-stone-200 hover:bg-stone-50'}`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex justify-between pt-2 border-t border-stone-100">
                <button
                  disabled={trapIndex === 0}
                  onClick={() => setTrapIndex(prev => prev - 1)}
                  className="px-3 py-1.5 text-xs text-stone-500 disabled:opacity-30"
                >
                  {isSr ? "← Prethodna zamka" : "← Vorherige Falle"}
                </button>
                <button
                  disabled={trapIndex + 1 >= SOUND_TRAPS_DATA.length}
                  onClick={() => setTrapIndex(prev => prev + 1)}
                  className="px-3 py-1.5 text-xs font-bold text-rose-700 disabled:opacity-30"
                >
                  {isSr ? "Sledeća zamka →" : "Nächste Falle →"}
                </button>
              </div>

            </div>
          )}

          {practiceMode === "type" && (
            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-rose-100 shadow-xs space-y-4 max-w-lg mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-stone-900 text-sm">{isSr ? "⌨️ Kucaj Reč (Aktivno Prizivanje)" : "⌨️ Wort Eintippen (Aktives Abrufen)"}</h3>
                  <p className="text-xs text-stone-500 mt-0.5">
                    {isSr ? "Otkucaj tačan prevod koristeći specijalne tastere sa kvačicama!" : "Tippe die richtige Übersetzung mit den Sonderzeichen-Tasten!"}
                  </p>
                </div>
                <span className="text-xs font-bold text-stone-400 font-mono">
                  #{typeWordIdx + 1}
                </span>
              </div>

              <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200 text-center space-y-1">
                <span className="text-[10px] uppercase font-bold text-stone-400 block">
                  {isSr ? "Zadatak za kucanje:" : "Aufgabe zum Eintippen:"}
                </span>
                <span className="text-xl font-black text-stone-900 block">
                  {learnerTrack === "sr" ? typeWord.de : typeWord.sr}
                </span>
                <span className="text-xs text-stone-500 italic block">{typeWord.en}</span>
              </div>

              <form onSubmit={handleCheckTyped} className="space-y-3">
                <div className="space-y-1">
                  <input

                  />

                  <span className="text-[10px] font-bold text-stone-400 block">
                    {isSr ? "Dodirni taster za unos specifičnih slova:" : "Tippe auf eine Taste für Sonderzeichen:"}

                  <button

                  >

                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setTypeWordIdx(prev => prev + 1);

                      setTypeFeedback(null);

                    className="px-4 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-bold"
                  >
                    {isSr ? "Sledeća reč →" : "Nächstes Wort →"}
                  </button>
                </div>
              </form>

              {typeFeedback && (
                <div className={`p-3 rounded-2xl text-xs font-bold animate-in fade-in ${typeFeedback.status === 'exact' ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-amber-50 text-amber-900 border border-amber-200'}`}>

          {practiceMode === "quiz" && (
            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-rose-100 shadow-xs space-y-4 max-w-lg mx-auto">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="font-bold text-stone-900 text-sm">{isSr ? "🎯 Brzi Kviz (Speed Quiz)" : "🎯 Schnell-Quiz"}</h3>

                <div className="text-right">
                  <span className="text-xs font-bold text-emerald-600 block">{isSr ? "Rezultat:" : "Punkte:"} {quizScore}</span>

                </div>
              </div>

              <div className="p-5 bg-rose-50/50 rounded-2xl border border-rose-100 text-center space-y-1.5">
                <span className="text-[10px] uppercase font-bold text-stone-400 block">
                  {isSr ? "Kako se kaže:" : "Wie sagt man:"}
                </span>
                <h2 className="text-2xl font-black text-rose-950">
                  {learnerTrack === "sr" ? quizTargetWord.de : quizTargetWord.sr}

                <span className="text-xs text-stone-500">{quizTargetWord.en}</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                {quizOptions.map((opt, i) => {
                  const correct = learnerTrack === "sr" ? quizTargetWord.sr : quizTargetWord.de;
                  const isCorrect = opt === correct;
                  const isSelected = opt === quizSelectedOption;
                  let style = "bg-white border-stone-200 text-stone-800 hover:bg-stone-50";

                  if (quizAnswered) {
                    if (isCorrect) style = "bg-emerald-50 border-emerald-300 text-emerald-900 font-bold";
                    else if (isSelected) style = "bg-red-50 border-red-300 text-red-900";
                  }

                  return (
                    <button
                      key={i}
                      disabled={quizAnswered}
                      onClick={() => handleSelectQuizOption(opt)}
                      className={`p-3.5 rounded-2xl border text-xs font-bold text-center transition active:scale-95 ${style}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>

              {quizAnswered && (
                <div className="flex justify-end pt-2">
                  <button
                    onClick={handleNextQuiz}
                    className="px-5 py-2 bg-rose-900 hover:bg-rose-950 text-white rounded-xl text-xs font-bold transition shadow-xs"
                  >
                    {isSr ? "Sledeće pitanje →" : "Nächste Frage →"}
                  </button>
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // SCREEN 5: PROGRESS & 12 UNLOCKABLE COUPLE ACHIEVEMENTS
    // =========================================================================
    function ProgressView({ vocabulary, isSr, isRadoica, learnerTrack }) {
      const isTargetSr = learnerTrack === "sr";
      const totalWords = vocabulary.length;

      const newCount = vocabulary.filter(w => !w.fsrsState || w.fsrsState === 0).length;
      const learningCount = vocabulary.filter(w => w.fsrsState === 1).length;
      const knownCount = vocabulary.filter(w => w.fsrsState === 2).length;
      const strongCount = vocabulary.filter(w => w.fsrsStability > 5).length;

      const handleShareProgress = () => {
        const text = isTargetSr
          ? (isSr
              ? `❤️ Naš napredak u Zajedno aplikaciji: Malak je savladala ${learnedCount}/${totalWords} reči (${percent}%), održava 7 dana streak i uči srpski sa ljubavlju! Volim te najviše!`
              : `❤️ Unser Fortschritt in Zajedno: Malak hat ${learnedCount}/${totalWords} Wörter (${percent}%) gemeistert, hält einen 7-Tage-Streak und lernt Serbisch mit Liebe! Ich liebe dich über alles!`)

              : `❤️ Unser Fortschritt in Zajedno: Radoica hat ${learnedCount}/${totalWords} Wörter (${percent}%) gemeistert, hält einen 7-Tage-Streak und lernt Deutsch für Malak!`);
        navigator.clipboard.writeText(text);
        alert(isSr ? "Tekst napretka je kopiran za WhatsApp/iMessage! 💌" : "Fortschrittstext für WhatsApp/iMessage kopiert! 💌");
      };

      return (
        <div className="space-y-4">
          
          <div className="bg-white rounded-3xl p-6 border border-rose-100 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-6">
            <div className="flex items-center space-x-6">
              <div 
                className="w-24 h-24 rounded-full flex items-center justify-center shadow-inner relative flex-shrink-0"
                style={{ background: `conic-gradient(#ce335a ${percent}%, #fce8ec ${percent}% 100%)` }}
              >
                <div className="w-18 h-18 rounded-full bg-white flex flex-col items-center justify-center shadow-2xs">
                  <span className="text-xl font-black text-stone-900">{percent}%</span>
                  <span className="text-[9px] uppercase font-bold text-stone-400">{isSr ? "Savladano" : "Gemeistert"}</span>
                </div>
              </div>

              <div className="space-y-1">
                <h3 className="font-bold text-stone-900 text-sm">
                  {isTargetSr
                    ? (isSr ? "Malakin Srpski Jezički Napredak 🇨🇭🇷🇸" : "Malaks Serbisch-Fortschritt 🇨🇭🇷🇸")
                    : (isSr ? "Radoicin Nemački Napredak 🇷🇸🇩🇪" : "Radoicas Deutsch-Fortschritt 🇷🇸🇩🇪")}
                </h3>
                <p className="text-xs text-stone-500">
                  {isSr
                    ? <>Savladano <strong>{learnedCount}</strong> od ukupno <strong>{totalWords}</strong> reči i fraza.</>
                    : <>Gemeistert: <strong>{learnedCount}</strong> von insgesamt <strong>{totalWords}</strong> Wörtern & Sätzen.</>}
                </p>
                <div className="pt-1">
                  <button
                    onClick={handleShareProgress}
                    className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-800 rounded-xl text-xs font-bold border border-rose-200 transition flex items-center space-x-1.5"
                  >
                    <span>💌</span>
                    <span>{isSr ? "Pošalji partneru moj napredak" : "Meinen Fortschritt teilen"}</span>

                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 w-full sm:w-auto">
              <div className="bg-stone-50 p-2.5 rounded-xl border border-stone-200/60 text-center">
                <span className="text-xs font-black text-stone-900 block">{newCount}</span>

              </div>
              <div className="bg-amber-50 p-2.5 rounded-xl border border-amber-200/60 text-center">

    // =========================================================================

          textSr: isSr ? noteDraft : prev.textSr,

                  >
                    <div className={`card-3d-inner w-full h-full relative ${isFlipped ? 'flipped' : ''}`}>
                      
                      <div className="card-face-front absolute inset-0 rounded-3xl overflow-hidden border border-rose-100 shadow-xs relative">

                        <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent flex flex-col justify-between p-4 text-white">

                          <span>Zajedno / Zusammen</span>
                          <span className="font-bold text-rose-700">Radoica ❤️ Malak</span>
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      );
    }

    // =========================================================================
    // 1. HOME DASHBOARD (WARM, ROMANTIC COUNTDOWN & AFFIRMATION)
    // =========================================================================
    function DashboardView({ reunion, vocabulary, tasks, books, loveNote, setLoveNote, isSr, isRadoica, onEditReunion, onNavigate }) {
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [isEditingNote, setIsEditingNote] = useState(false);
      const [noteDraft, setNoteDraft] = useState(isSr ? loveNote.textSr : loveNote.textDe);

      useEffect(() => {
        setNoteDraft(isSr ? loveNote.textSr : loveNote.textDe);
      }, [isSr, loveNote]);

      useEffect(() => {
        const updateTimer = () => {
          const diff = new Date(reunion.date).getTime() - new Date().getTime();
          if (diff <= 0) {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          } else {
            setTimeLeft({
              days: Math.floor(diff / (1000 * 60 * 60 * 24)),
              hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
              minutes: Math.floor((diff / 1000 / 60) % 60),
              seconds: Math.floor((diff / 1000) % 60)
            });

                <input type="text" required value={location} onChange={e => setLocation(e.target.value)} className="w-full p-2.5 border rounded-xl" />
              </div>
              <div>
                <label className="block text-stone-600 mb-1">{isSr ? "Datum:" : "Datum:"}</label>
                <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="w-full p-2.5 border rounded-xl" />
              </div>
              <div className="flex justify-end space-x-2 pt-2">
                <button type="button" onClick={onClose} className="px-3 py-1.5 text-stone-500">
                  {isSr ? "Otkaži" : "Abbrechen"}
                </button>
                <button type="submit" className="px-4 py-1.5 bg-rose-700 text-white rounded-xl font-semibold shadow-xs">
                  {isSr ? "Sačuvaj" : "Speichern"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function SyncModal({ vocabulary, tasks, books, reunion, loveNote, isSr, onClose, onImport }) {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify({ vocabulary, tasks, books, reunion, loveNote }))));

      const handleCopy = () => {
        navigator.clipboard.writeText(code);
        alert(isSr ? "Sinhronizacioni kod je kopiran!" : "Code kopiert!");
      };

      const handlePaste = () => {
        const inp = prompt(isSr ? "Zalepi sinhronizacioni kod ovde:" : "Synchronisationscode hier einfügen:");
        if (inp) {
          try {
            const d = JSON.parse(decodeURIComponent(escape(atob(inp.trim()))));
            onImport(d);
          } catch (e) {
            alert(isSr ? "Nevažeći kod." : "Ungültiger Code.");
          }
        }
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 text-xs border border-rose-100 shadow-xl">
            <h3 className="font-bold text-stone-900 text-sm">
              {isSr ? "Sinhronizacija telefona" : "Handy-Synchronisation"}
            </h3>
            <textarea readOnly value={code} rows="3" className="w-full p-2 bg-stone-100 rounded-xl font-mono text-[10px] select-all border" />
            <div className="flex items-center justify-between">
              <button onClick={handleCopy} className="text-rose-600 font-semibold hover:underline">
                {isSr ? "Kopiraj kod" : "Code kopieren"}
              </button>
              <button onClick={handlePaste} className="text-stone-700 font-semibold hover:underline">
                {isSr ? "Uvezi kod" : "Code importieren"}
              </button>
            </div>
            <div className="flex justify-end pt-1">
              <button onClick={onClose} className="px-3 py-1.5 text-stone-500">
                {isSr ? "Zatvori" : "Schliessen"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT (TOP BAR CHROME & NAVIGATION)
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem("pro_couple_user") || "radoica");
      const [uiLang, setUiLang] = useState(() => localStorage.getItem("pro_couple_lang") || "sr");
      const [activeTab, setActiveTab] = useState("home"); // 'home', 'learning', 'tasks', 'books', 'memories'

      const [vocabulary, setVocabulary] = useState(() => {
        const s = localStorage.getItem("pro_couple_vocab");
        return s ? JSON.parse(s) : SEED_VOCABULARY;
      });

      const [tasks, setTasks] = useState(() => {
        const s = localStorage.getItem("pro_couple_tasks_empty");
        return s ? JSON.parse(s) : SEED_TASKS;
      });

      const [books, setBooks] = useState(() => {
        const s = localStorage.getItem("pro_couple_books");
        if (!s) return SEED_BOOKS;
        try {
          const parsed = JSON.parse(s);
          return parsed.map(b => {
            const seed = SEED_BOOKS.find(sb => sb.id === b.id);
            return seed ? { ...seed, ...b, quoteDe: b.quoteDe || seed.quoteDe, thoughtsDe: b.thoughtsDe || seed.thoughtsDe } : b;
          });
        } catch (e) {
          return SEED_BOOKS;
        }
      });

      const [reunion, setReunion] = useState(() => {
        const s = localStorage.getItem("pro_couple_reunion");
        return s ? JSON.parse(s) : SEED_REUNION;
      });

      const [loveNote, setLoveNote] = useState(() => {
        const s = localStorage.getItem("pro_couple_lovenote");
        if (!s) return SEED_LOVE_NOTE;
        try {
          const parsed = JSON.parse(s);
          return { ...SEED_LOVE_NOTE, ...parsed, updatedAtDe: parsed.updatedAtDe || SEED_LOVE_NOTE.updatedAtDe };
        } catch (e) {
          return SEED_LOVE_NOTE;
        }
      });

      const todayStr = new Date().toISOString().split("T")[0];
      const [dailyMissions, setDailyMissions] = useState(() => {
        const saved = localStorage.getItem("zajedno_daily_missions");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.date === todayStr) return parsed;
        }
        return { review: false, practice: false, say: false, date: todayStr };
      });

      const [heartTapCount, setHeartTapCount] = useState(0);
      const [isEasterEggOpen, setIsEasterEggOpen] = useState(false);
      const [isMissionModalOpen, setIsMissionModalOpen] = useState(false);

      const [isEditReunionOpen, setIsEditReunionOpen] = useState(false);
      const [isSyncOpen, setIsSyncOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem("pro_couple_user", currentUser);
        localStorage.setItem("pro_couple_lang", uiLang);
        localStorage.setItem("pro_couple_vocab", JSON.stringify(vocabulary));
        localStorage.setItem("pro_couple_tasks_empty", JSON.stringify(tasks));
        localStorage.setItem("pro_couple_books", JSON.stringify(books));
        localStorage.setItem("pro_couple_reunion", JSON.stringify(reunion));
        localStorage.setItem("pro_couple_lovenote", JSON.stringify(loveNote));
        localStorage.setItem("zajedno_daily_missions", JSON.stringify(dailyMissions));
      }, [currentUser, uiLang, vocabulary, tasks, books, reunion, loveNote, dailyMissions]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const isSr = uiLang === "sr";
      const isRadoica = currentUser === "radoica";

      const toggleUser = () => {
        const next = isRadoica ? "malak" : "radoica";
        setCurrentUser(next);
        setUiLang(next === "radoica" ? "sr" : "de");
      };

      const handleCompleteMission = (stepKey) => {
        setDailyMissions(prev => ({
          ...prev,
          [stepKey]: true
        }));
      };

      const handleHeartClick = () => {
        const next = heartTapCount + 1;
        setHeartTapCount(next);
        if (next >= 5) {
          setIsEasterEggOpen(true);
          setHeartTapCount(0);
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
          }
        }
        setTimeout(() => setHeartTapCount(0), 3000);
      };

      const missionDoneCount = (dailyMissions.review ? 1 : 0) + (dailyMissions.practice ? 1 : 0) + (dailyMissions.say ? 1 : 0);

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-4xl mx-auto px-4 sm:px-6 pb-20 pt-3">
          
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md rounded-2xl px-4 py-2.5 border border-rose-100 shadow-xs mb-4">
            <div className="flex items-center justify-between">
              
              <div className="flex items-center space-x-2.5 select-none">
                <div 
                  onClick={handleHeartClick}
                  className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-wine-900 via-rose-900 to-romantic-600 text-white flex items-center justify-center font-bold text-xs shadow-xs cursor-pointer active:scale-90 transition"
                  title={isSr ? "Klikni 5 puta za tajnu poruku! ❤️" : "5x tippen für geheime Nachricht! ❤️"}
                >
                  <span className="heart-pulse text-base">❤️</span>
                </div>
                <div onClick={() => setActiveTab("home")} className="cursor-pointer">
                  <div className="flex items-center space-x-1.5 leading-none">
                    <span className="font-extrabold text-stone-900 text-sm tracking-tight">Zajedno</span>
                    <span className="text-[11px] font-bold text-rose-500">/ Zusammen</span>
                  </div>
                  <span className="text-[10px] text-stone-400 font-medium">Radoica & Malak</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                
                <button
                  onClick={() => setIsMissionModalOpen(true)}
                  className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center space-x-1 border ${missionDoneCount === 3 ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-900 border-rose-200 hover:bg-rose-100'}`}
                  title={isSr ? "Dnevne Misije" : "Tagesmissionen"}
                >
                  <span>{missionDoneCount === 3 ? "✓" : "✦"}</span>
                  <span className="tabular-nums">{missionDoneCount}/3 {isSr ? "danas" : "heute"}</span>
                </button>

                <div className="flex items-center bg-rose-50/70 p-0.5 rounded-xl border border-rose-100 text-xs">
                  <button 
                    onClick={() => setUiLang("sr")}
                    className={`px-2 py-0.5 rounded-lg font-bold transition ${isSr ? 'bg-white text-rose-900 shadow-2xs' : 'text-stone-500 hover:text-stone-900'}`}
                  >
                    SR 🇷🇸
                  </button>
                  <button 
                    onClick={() => setUiLang("de")}
                    className={`px-2 py-0.5 rounded-lg font-bold transition ${!isSr ? 'bg-white text-rose-900 shadow-2xs' : 'text-stone-500 hover:text-stone-900'}`}
                  >
                    DE 🇩🇪
                  </button>
                </div>

                <button 
                  onClick={toggleUser}
                  className="flex items-center space-x-1.5 bg-white hover:bg-rose-50 border border-rose-100 pl-1.5 pr-2.5 py-1 rounded-xl transition text-xs font-bold text-stone-800 shadow-2xs"
                  title={isSr ? "Promeni aktivni profil" : "Aktives Profil wechseln"}
                >
                  <img 
                    src={isRadoica ? "images/photo_03.jpg" : "images/photo_04.jpg"} 
                    className="w-5 h-5 rounded-full object-cover ring-1 ring-rose-200"
                    alt={isRadoica ? "Radoica" : "Malak"}
                  />
                  <span>{isRadoica ? "Radoica" : "Malak"}</span>
                </button>

                <button 
                  onClick={() => setIsSyncOpen(true)}
                  className="p-1.5 rounded-xl hover:bg-rose-50 border border-rose-100 text-stone-500 transition"
                  title={isSr ? "Sinhronizacija telefona" : "Handy-Synchronisation"}
                >
                  📱
                </button>

              </div>

            </div>
          </header>

          <nav className="flex items-center space-x-1 p-1 bg-stone-100/90 rounded-2xl border border-stone-200/80 text-xs font-bold overflow-x-auto no-scrollbar mb-5">
            <button 
              onClick={() => setActiveTab("home")}
              className={`flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 whitespace-nowrap ${activeTab === 'home' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}
            >
              <span>🏠</span>
              <span>{isSr ? "Početna" : "Start"}</span>
            </button>

            <button 
              onClick={() => setActiveTab("learning")}
              className={`flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 whitespace-nowrap ${activeTab === 'learning' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}
            >
              <span>✨</span>
              <span>{isSr ? "Učenje & Gramatika" : "Lernen & Grammatik"}</span>
              <span className="text-[10px] bg-rose-100 text-rose-800 px-1.5 py-0.2 rounded-full font-bold">{vocabulary.length}</span>
            </button>

            <button 
              onClick={() => setActiveTab("tasks")}
              className={`flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 whitespace-nowrap ${activeTab === 'tasks' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}
            >
              <span>✓</span>
              <span>{isSr ? "Zadaci" : "To-Do"}</span>
              <span className="text-[10px] bg-stone-200 text-stone-700 px-1.5 py-0.2 rounded-full font-bold">{tasks.length}</span>
            </button>

            <button 
              onClick={() => setActiveTab("books")}
              className={`flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 whitespace-nowrap ${activeTab === 'books' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}
            >
              <span>📚</span>
              <span>{isSr ? "Knjige" : "Bücher"}</span>
            </button>

            <button 
              onClick={() => setActiveTab("memories")}
              className={`flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 whitespace-nowrap ${activeTab === 'memories' ? 'bg-white text-stone-900 shadow-2xs' : 'text-stone-600 hover:text-stone-900'}`}
            >
              <span>📸</span>
              <span>{isSr ? "Uspomene" : "Fotos"}</span>
              <span className="text-[10px] bg-rose-50 text-rose-600 px-1.5 py-0.2 rounded-full font-bold">47</span>
            </button>
          </nav>

          <main className="flex-grow space-y-5">
            
            {activeTab === "home" && (
              <DashboardView 
                reunion={reunion}
                vocabulary={vocabulary}
                tasks={tasks}
                books={books}
                loveNote={loveNote}
                setLoveNote={setLoveNote}
                isSr={isSr}
                isRadoica={isRadoica}
                onEditReunion={() => setIsEditReunionOpen(true)}
                onNavigate={setActiveTab}
              />
            )}

            {activeTab === "learning" && (
              <LearningHubView 
                vocabulary={vocabulary}
                setVocabulary={setVocabulary}
                dailyMissions={dailyMissions}
                onCompleteMission={handleCompleteMission}
                loveNote={loveNote}
                setLoveNote={setLoveNote}
                isSr={isSr}
                isRadoica={isRadoica}
              />
            )}

            {activeTab === "tasks" && (
              <TasksBucketListView 
                tasks={tasks}
                setTasks={setTasks}
                isSr={isSr}
                isRadoica={isRadoica}
              />
            )}

            {activeTab === "books" && (
              <BookClubView 
                books={books}
                setBooks={setBooks}
                isSr={isSr}
                isRadoica={isRadoica}
              />
            )}

            {activeTab === "memories" && (
              <MemoriesView isSr={isSr} />
            )}

          </main>

          {isEasterEggOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" onClick={() => setIsEasterEggOpen(false)}>
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 border border-rose-200 shadow-2xl animate-in fade-in zoom-in-95" onClick={e => e.stopPropagation()}>
                <div className="w-16 h-16 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                  ❤️
                </div>
                <div className="space-y-1">
                  <h3 className="font-extrabold text-stone-900 text-base">
                    {isSr ? "Tajna Poruka za Malak & Radoicu!" : "Geheime Nachricht für Malak & Radoica!"}
                  </h3>
                  <span className="text-[11px] text-rose-500 font-bold uppercase tracking-wider block">
                    {isSr ? "Otključano tajnim dodirom" : "Durch geheimes Tippen freigeschaltet"}
                  </span>
                </div>
                <p className="text-xs text-stone-700 leading-relaxed font-serif italic bg-rose-50/50 p-4 rounded-2xl border border-rose-100">
                  {isSr
                    ? '"Od onog prvog susreta na obali Jadranskog mora u Hrvatskoj, preko svake šolje Kamillentea u Embrachu i nane u Beogradu, svaka nova reč koju naučimo briše daljinu i gradi naš zajednički dom. Volim te najviše na svetu! — Tvoj Rade ❤️"'
                    : '"Seit jenem ersten Treffen an der Adria in Kroatien, über jede Tasse Kamillentee in Embrach und Pfefferminztee in Belgrad, löst jedes neue Wort die Entfernung auf und baut unser gemeinsames Zuhause. Ich liebe dich über alles! — Dein Rade ❤️"'}
                </p>
                <button
                  onClick={() => setIsEasterEggOpen(false)}
                  className="w-full py-2.5 bg-rose-900 text-white rounded-xl text-xs font-bold hover:bg-rose-950 transition"
                >
                  {isSr ? "Čuvam u srcu ❤️" : "Im Herzen behalten ❤️"}
                </button>
              </div>
            </div>
          )}

          {isMissionModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4" onClick={() => setIsMissionModalOpen(false)}>
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 text-stone-800 shadow-xl border border-rose-100" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-rose-50 pb-2">
                  <div className="flex items-center space-x-2">
                    <span className="text-base">✦</span>
                    <h3 className="font-bold text-stone-900 text-sm">
                      {isSr ? `Dnevne Misije (${missionDoneCount}/3)` : `Tagesmissionen (${missionDoneCount}/3)`}
                    </h3>
                  </div>
                  <button onClick={() => setIsMissionModalOpen(false)} className="p-1 text-stone-400 hover:text-stone-700">✕</button>
                </div>

                <div className="space-y-2.5 text-xs">
                  <div className={`p-3 rounded-2xl border flex items-center justify-between ${dailyMissions.review ? 'bg-emerald-50 border-emerald-200 text-emerald-900 font-bold' : 'bg-stone-50 border-stone-200'}`}>
                    <span>{isSr ? "1. Ponovi 5 kartica u FSRS sistemu" : "1. 5 Karten im FSRS wiederholen"}</span>
                    <span>{dailyMissions.review ? (isSr ? "✓ Završeno" : "✓ Erledigt") : (isSr ? "Na čekanju" : "Offen")}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border flex items-center justify-between ${dailyMissions.practice ? 'bg-emerald-50 border-emerald-200 text-emerald-900 font-bold' : 'bg-stone-50 border-stone-200'}`}>
                    <span>{isSr ? "2. Reši vežbu ili scenario dopisivanja" : "2. Übung oder Chat-Szenario lösen"}</span>
                    <span>{dailyMissions.practice ? (isSr ? "✓ Završeno" : "✓ Erledigt") : (isSr ? "Na čekanju" : "Offen")}</span>
                  </div>
                  <div className={`p-3 rounded-2xl border flex items-center justify-between ${dailyMissions.say ? 'bg-emerald-50 border-emerald-200 text-emerald-900 font-bold' : 'bg-stone-50 border-stone-200'}`}>
                    <span>{isSr ? "3. Pošalji ljubavnu poruku partneru" : "3. Liebesnachricht an Partner senden"}</span>
                    <span>{dailyMissions.say ? (isSr ? "✓ Završeno" : "✓ Erledigt") : (isSr ? "Na čekanju" : "Offen")}</span>
                  </div>
                </div>

                <div className="flex justify-end pt-1">
                  <button onClick={() => setIsMissionModalOpen(false)} className="px-4 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold">
                    {isSr ? "Zatvori" : "Schliessen"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {isEditReunionOpen && (
            <EditReunionModal 
              reunion={reunion}
              isSr={isSr}
              onClose={() => setIsEditReunionOpen(false)}
              onSave={(updated) => { setReunion(updated); setIsEditReunionOpen(false); }}
            />
          )}

          {isSyncOpen && (
            <SyncModal 
              vocabulary={vocabulary}
              tasks={tasks}
              books={books}
              reunion={reunion}
              loveNote={loveNote}
              isSr={isSr}
              onClose={() => setIsSyncOpen(false)}
              onImport={(d) => {
                if (d.vocabulary) setVocabulary(d.vocabulary);
                if (d.tasks) setTasks(d.tasks);
                if (d.books) setBooks(d.books);
                if (d.reunion) setReunion(d.reunion);
                if (d.loveNote) setLoveNote(d.loveNote);
                setIsSyncOpen(false);
              }}
            />
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
